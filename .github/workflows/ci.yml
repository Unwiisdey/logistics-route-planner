name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python data tests
        run: python -m unittest discover -s tests -p "test_plot*.py" -v
      - name: Build web UI assets
        run: python ui/build_live.py
      - name: End-to-end demonstration
        run: python scripts/demo.py --output exports/ci-demo
      - name: Install optional plotting dependency
        run: python -m pip install -r scripts/requirements.txt
      - name: Render traffic output
        run: python scripts/plot_traffic.py --input-dir exports/ci-demo/traffic --frame 10 --output exports/ci-demo/traffic.png
